<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Black Calculator</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#000000,#0f2027,#203a43);
        }

        .box{
            border: 2px solid #00ff66;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4,100px);
            grid-template-rows: repeat(5,100px);
            padding: 40px;
            gap: 10px;
            justify-content: center;
            align-content: center;
            scale: 0.8;

            background: #111;
            border-radius: 25px;
            box-shadow: 0px 10px 25px rgba(0,255,102,0.3);
        }

        .sbox{
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #00ff66;
            border-radius: 15px;

            font-size: 28px;
            font-weight: bold;
            color: #00ff66;

            background: #111;
            cursor: pointer;
            transition: 0.3s;
        }

        .sbox:hover{
            transform: scale(1.08);
            background: #00ff66;
            color: black;
            box-shadow: 0 0 20px #00ff66,
                        0 0 40px #00ff66;
        }

        #screen{
            grid-column: 1/5;
            display: flex;
            justify-content: end;
            align-items: end;
            font-size: 35px;
            padding: 15px;

            background: #000;
            color: #00ff66;
            border: 2px solid #00ff66;
            border-radius: 15px;
        }

        /* Equal Button */
        .box .sbox:nth-child(16){
            background: #00ff66;
            color: black;
            font-weight: bold;
        }

        .box .sbox:nth-child(16):hover{
            background: #00cc55;
            box-shadow: 0 0 25px #00ff66;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="sbox" id="screen">0</div>

        <div class="sbox" onclick="cal('7')">7</div>
        <div class="sbox" onclick="cal('8')">8</div>
        <div class="sbox" onclick="cal('9')">9</div>
        <div class="sbox" onclick="cal('*')">*</div>

        <div class="sbox" onclick="cal('4')">4</div>
        <div class="sbox" onclick="cal('5')">5</div>
        <div class="sbox" onclick="cal('6')">6</div>
        <div class="sbox" onclick="cal('/')">/</div>

        <div class="sbox" onclick="cal('1')">1</div>
        <div class="sbox" onclick="cal('2')">2</div>
        <div class="sbox" onclick="cal('3')">3</div>
        <div class="sbox" onclick="cal('+')">+</div>

        <div class="sbox" onclick="cal('.')">.</div>
        <div class="sbox" onclick="cal('0')">0</div>
        <div class="sbox" onclick="cal('=')">=</div>
        <div class="sbox" onclick="cal('-')">-</div>
    </div>

    <script>
        let screentxt = "";

        function screenupdate(txt)
        {
            screentxt += txt;
            document.getElementById("screen").innerText = screentxt;
        }

        function cal(btn)
        {
            switch(btn)
            {
                case '1':
                case '2':
                case '3':
                case '4':
                case '5':
                case '6':
                case '7':
                case '8':
                case '9':
                case '0':
                case '.':
                case '+':
                case '-':
                case '*':
                case '/':
                    screenupdate(btn);
                    break;

                case '=':
                    try{
                        let temp = eval(screentxt);
                        screentxt = temp.toString();
                        document.getElementById("screen").innerText = temp;
                    }
                    catch{
                        document.getElementById("screen").innerText = "Error";
                        screentxt = "";
                    }
                    break;
            }
        }
    </script>

</body>
</html>
